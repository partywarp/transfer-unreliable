<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>transfer-unreliable</title>
	</head>
	<body>
		<script type="module">
			const websocket = new WebSocket("/ws");
			const historyEl = document.getElementById("message-history");
			/**
			 * @param {string} text
			 * @param {"user" | "server"} side
			 */
			function addMessage(text, side) {
				const el = document.createElement("div");
				el.textContent = text;
				el.className = side;
				historyEl.append(el);
			}
			websocket.addEventListener("message", (event) => {
				addMessage(event.data, "server");
			});
			document
				.getElementById("message-box")
				.addEventListener("submit", (event) => {
					event.preventDefault();
					const data = new FormData(event.currentTarget);
					addMessage(data.get("message"), "user");
					websocket.send(data.get("message"));
					event.currentTarget.elements["message"].value = "";
				});
		</script>
		<div id="message-history"></div>
		<form id="message-box">
			<input class="message-box" name="message" required type="text" />
		</form>
		<style>
			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}
			body {
				height: 100dvh;
				display: flex;
				flex-direction: column;
				overflow: hidden;
			}

			#message-history {
				flex: 1;
				min-height: 0;
				overflow-y: auto;
				font-size: 2rem;
			}

			#message-box {
				flex-shrink: 0;
			}
      
			.message-box {
        width: 100%;
				border: 4px ridge black;
        font-size: 2rem;
			}
			.user {
				background-color: #ddd;
			}
			.server {
				background-color: #bbb;
			}
		</style>
	</body>
</html>
