<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>transfer-unreliable</title>
	</head>
	<body>
		<script type="module">
			const websocket = new WebSocket("/ws");
			const messageQueue = [];
			const msgForm = document.getElementById("message-box");
			const historyEl = document.getElementById("message-history");
			const opened = new Promise((r) =>
				websocket.addEventListener(
					"open",
					() => {
						const el = document.createElement("div");
						el.className = "bg-green-500 size-2 rounded-full right-3 absolute top-1/2 -translate-y-1/2";
						msgForm.append(el);
						r();
					},
					{ once: true },
				),
			);
			/**
			 * @param {string} text
			 * @param {"user" | "server"} side
			 */
			function addMessage(text, side) {
				const el = document.createElement("div");
				el.textContent = text;
				el.className = side == "server" ? "bg-slate-200" : "";
				historyEl.append(el);
			}
			websocket.addEventListener("message", (event) => {
				addMessage(event.data, "server");
			});
			msgForm.addEventListener("submit", (event) => {
				event.preventDefault();
				const data = new FormData(event.currentTarget);
				addMessage(data.get("message"), "user");
				messageQueue.push(data.get("message"));
				(async function () {
					await opened;
					while (messageQueue.length) {
						websocket.send(messageQueue.shift());
					}
				})();
				event.currentTarget.elements["message"].value = "";
			});
		</script>
		<div class="border-slate-500 bg-slate-400 border-64 h-screen overflow-auto">
			<div id="message-history"></div>
			<form id="message-box" class="relative">
				<input
					class="w-full p-2 border-slate-600 border-4 outline-none focus:bg-slate-300"
					name="message"
					required
					type="text"
					autocomplete="off"
					autocorrect="off"
					spellcheck="false"
				/>
			</form>
		</div>
		<style>
			@import "tailwindcss";
		</style>
	</body>
</html>
